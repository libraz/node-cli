name: Publish and Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@12.2.2
      - run: corepack enable
      - run: corepack prepare yarn@4.18.1 --activate

      # v6.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .yarn/cache
            node_modules
          key: ${{ runner.os }}-node-26-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-26-yarn-

      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build
      - run: yarn typecheck:types
      - run: yarn typecheck:min-types
      - run: node scripts/check-usage-errors.mjs
      - run: node scripts/check-removed-names.mjs
      - run: yarn typecheck:examples
      - run: yarn test:examples
      - run: yarn test --run --coverage
      - run: yarn test:git-install

      - name: Validate release metadata
        id: metadata
        run: >-
          node scripts/release-metadata.mjs
          --tag "$GITHUB_REF_NAME"
          --github-output "$GITHUB_OUTPUT"
          --notes release-notes.md

      - name: Build and verify publish artifact
        id: artifact
        run: |
          node scripts/pack-smoke.mjs --keep --manifest pack-artifact.json
          echo "tarball=$(node -p "require('./pack-artifact.json').filename")" >> "$GITHUB_OUTPUT"

      - name: Publish verified tarball to npm
        run: npm publish "${{ steps.artifact.outputs.tarball }}" --access public --tag "${{ steps.metadata.outputs.dist_tag }}"

      # v3.0.4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          body_path: release-notes.md
          files: |
            ${{ steps.artifact.outputs.tarball }}
            pack-artifact.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
