name: CI

on:
  push:
    branches: [main]
    tags-ignore:
      - 'v*.*.*'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README*.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'yarn.lock'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README*.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'yarn.lock'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}

      # The npm the publish workflow uses, so its git-install smoke runs here first.
      - if: matrix.node == 26
        run: npm install -g npm@12.2.2
      - run: corepack enable
      - run: corepack prepare yarn@4.18.1 --activate

      # v6.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .yarn/cache
            node_modules
          key: ${{ runner.os }}-node-${{ matrix.node }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-yarn-

      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build
      - run: yarn typecheck:types
      - run: yarn typecheck:min-ts
      - run: yarn typecheck:min-types
      - run: node scripts/check-usage-errors.mjs
      - run: node scripts/check-removed-names.mjs
      - run: yarn typecheck:examples
      - run: yarn test:examples
      - if: matrix.node == 26
        run: yarn test --run --coverage
      - if: matrix.node != 26
        run: yarn test --run
      - run: yarn test:pack
      - if: matrix.node == 26
        run: yarn test:git-install

      # v7.1.1
      - if: matrix.node == 26
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
