name: CI

on:
  push:
    branches: [main]
    tags-ignore:
      - 'v*.*.*'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README*.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'yarn.lock'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README*.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'yarn.lock'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}

      - run: corepack enable
      - run: corepack prepare yarn@4.18.0 --activate

      # v6.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .yarn/cache
            node_modules
          key: ${{ runner.os }}-node-${{ matrix.node }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-yarn-

      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build
      - run: yarn typecheck:examples
      - run: yarn test:examples
      - if: matrix.node == 24
        run: yarn test --run --coverage
      - if: matrix.node != 24
        run: yarn test --run
      - run: yarn test:pack
      - if: matrix.node == 24
        run: yarn test:git-install

      # v7.0.0
      - if: matrix.node == 24
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
