<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 542" width="960" height="542" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">What happens between the input and your action</title>
  <desc id="dsc">A two-row pipeline. The top row is the framework's work, left to right: the input line or argv is tokenized with quotes respected, the command path is matched by walking the tree from the root and resolving aliases, positional arguments are bound in declaration order for required, optional and variadic slots, option flags are parsed, and options are resolved in two passes — first your parse or built-in coercion then defaults and the required check, then choices and your validate. The bottom row is your code and the events, in order: command.validate(ctx), the beforeExecute event, action(ctx), and the afterExecute event, which runs only if the action resolved. Below, a warn-coloured branch shows that a failure at any stage emits commandError, which fires only once a command path has resolved, and also error — both fire, in that order — after which the message goes to stderr and process.exitCode is set.</desc>

  <style>
    .bg    { fill:#f6f8fa }
    .grp   { fill:#eaeef2 }
    .chip  { fill:#ffffff; stroke:#d0d7de }
    .card  { fill:#ffffff; stroke:#2f6f4f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .warnbox { fill:#ffffff; stroke:#a3401f }
    .seam  { fill:none; stroke:#afb8c1; stroke-dasharray:6 5 }
    .ln    { fill:none; stroke:#2f6f4f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .lnn   { fill:none; stroke:#8c959f; stroke-width:1.4 }
    .lnw   { fill:none; stroke:#a3401f; stroke-width:1.4 }
    .ah    { fill:#2f6f4f }
    .ah2   { fill:#3f6b8a }
    .ahn   { fill:#8c959f }
    .ahw   { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#636c76; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#636c76 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#2f6f4f }
    .monon { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#1f2328 }
    .warnt { fill:#a3401f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#56d364} .alt{fill:#161b22;stroke:#7fb3d5}
      .warnbox{fill:#161b22;stroke:#e08a68}
      .seam{stroke:#484f58}
      .ln{stroke:#56d364} .ln2{stroke:#7fb3d5} .lnn{stroke:#6e7681} .lnw{stroke:#e08a68}
      .ah{fill:#56d364} .ah2{fill:#7fb3d5} .ahn{fill:#6e7681} .ahw{fill:#e08a68}
      .mono{fill:#56d364} .monon{fill:#e6edf3} .warnt{fill:#e08a68}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="n" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ahn" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="w" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ahw" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="542" rx="12"/>

  <rect class="chip" x="32" y="128" width="88" height="48" rx="6"/>
  <text class="h" x="44" y="148">input</text>
  <text class="s" x="44" y="164">line or argv</text>
  <path class="lnn" d="M 120 152 H 138" marker-end="url(#n)"/>

  <rect class="grp" x="130" y="68" width="806" height="148" rx="8"/>
  <text class="lbl" x="144" y="88">THE FRAMEWORK DOES THIS</text>

  <rect class="chip" x="144" y="100" width="110" height="104" rx="5"/>
  <text class="h" x="156" y="120">tokenize</text>
  <text class="s" x="156" y="140">split the line,</text>
  <text class="s" x="156" y="154">quotes kept</text>

  <path class="lnn" d="M 254 152 H 266" marker-end="url(#n)"/>

  <rect class="chip" x="272" y="100" width="146" height="104" rx="5"/>
  <text class="h" x="284" y="120">match the</text>
  <text class="h" x="284" y="136">command path</text>
  <text class="s" x="284" y="156">walk the tree from</text>
  <text class="s" x="284" y="170">the root, resolving</text>
  <text class="s" x="284" y="184">aliases</text>

  <path class="lnn" d="M 418 152 H 430" marker-end="url(#n)"/>

  <rect class="chip" x="436" y="100" width="146" height="104" rx="5"/>
  <text class="h" x="448" y="120">bind arguments</text>
  <text class="s" x="448" y="138">positionals, in order</text>
  <text class="monon" x="448" y="156">&lt;required&gt;</text>
  <text class="monon" x="448" y="170">[optional]</text>
  <text class="monon" x="448" y="184">[...variadic]</text>

  <path class="lnn" d="M 582 152 H 594" marker-end="url(#n)"/>

  <rect class="chip" x="600" y="100" width="120" height="104" rx="5"/>
  <text class="h" x="612" y="120">parse option</text>
  <text class="h" x="612" y="136">flags</text>
  <text class="monon" x="612" y="156">--name value</text>
  <text class="monon" x="612" y="170">-n, -abc</text>
  <text class="s" x="612" y="188">shorts group up</text>

  <path class="lnn" d="M 720 152 H 732" marker-end="url(#n)"/>

  <rect class="chip" x="738" y="100" width="186" height="104" rx="5"/>
  <text class="h" x="750" y="120">resolve options</text>
  <text class="s" x="750" y="138">pass 1 — your parse or</text>
  <text class="s" x="750" y="152">coercion, then default,</text>
  <text class="s" x="750" y="166">then required</text>
  <text class="s" x="750" y="180">pass 2 — choices, then</text>
  <text class="s" x="750" y="194">your validate</text>

  <path class="lnn" d="M 831 204 V 230 H 234 V 284" marker-end="url(#n)"/>
  <text class="s" x="532" y="224" text-anchor="middle">the framework is done — your code runs next</text>

  <rect class="grp" x="130" y="256" width="806" height="112" rx="8"/>
  <text class="lbl" x="144" y="274">YOUR CODE AND THE EVENTS, IN ORDER</text>

  <rect class="card" x="144" y="288" width="180" height="68" rx="5"/>
  <text class="lbl" x="156" y="308">YOU WRITE THIS</text>
  <text class="mono" x="156" y="326">command.validate(ctx)</text>
  <text class="s" x="156" y="344">optional pre-flight check</text>

  <path class="ln" d="M 324 322 H 338" marker-end="url(#a)"/>

  <rect class="alt" x="344" y="288" width="180" height="68" rx="5"/>
  <text class="lbl" x="356" y="308">EVENT</text>
  <text class="monon" x="356" y="326">beforeExecute</text>
  <text class="s" x="356" y="344">listeners run first</text>

  <path class="ln" d="M 524 322 H 538" marker-end="url(#a)"/>

  <rect class="card" x="544" y="288" width="180" height="68" rx="5"/>
  <text class="lbl" x="556" y="308">YOU WRITE THIS</text>
  <text class="mono" x="556" y="326">action(ctx)</text>
  <text class="s" x="556" y="344">your command body</text>

  <path class="ln" d="M 724 322 H 738" marker-end="url(#a)"/>

  <rect class="alt" x="744" y="288" width="180" height="68" rx="5"/>
  <text class="lbl" x="756" y="308">EVENT</text>
  <text class="monon" x="756" y="326">afterExecute</text>
  <text class="s" x="756" y="344">only if the action resolved</text>

  <path class="seam" d="M 130 386 H 936"/>
  <path class="lnw" d="M 235 386 V 400" marker-end="url(#w)"/>

  <rect class="warnbox" x="130" y="406" width="210" height="88" rx="6"/>
  <text class="lbl warnt" x="142" y="426">ON FAILURE</text>
  <text class="h warnt" x="142" y="446">any stage above</text>
  <text class="s" x="142" y="464">matching, binding, options,</text>
  <text class="s" x="142" y="480">your validate, or your action</text>

  <path class="lnw" d="M 340 450 H 352 V 422 H 366" marker-end="url(#w)"/>
  <path class="lnw" d="M 340 450 H 352 V 478 H 366" marker-end="url(#w)"/>

  <rect class="chip" x="370" y="406" width="190" height="32" rx="5"/>
  <text class="monon" x="465" y="426" text-anchor="middle">commandError</text>
  <text class="s" x="370" y="452">only if a command path resolved</text>
  <rect class="chip" x="370" y="462" width="190" height="32" rx="5"/>
  <text class="monon" x="465" y="482" text-anchor="middle">error</text>

  <path class="lnw" d="M 568 412 H 576 V 488 H 568"/>
  <path class="lnw" d="M 576 450 H 734" marker-end="url(#w)"/>
  <text class="s warnt" x="656" y="442" text-anchor="middle">both fire, in this order</text>

  <rect class="chip" x="740" y="406" width="196" height="88" rx="6"/>
  <text class="h" x="752" y="428">reported</text>
  <text class="s" x="752" y="448">the message goes to stderr</text>
  <text class="monon" x="752" y="466">process.exitCode</text>
  <text class="s" x="752" y="482">is set from the error</text>

  <text class="s" x="480" y="518" text-anchor="middle">Everything left of your validate is the framework's work. commandError carries the same ctx your action would have received.</text>
</svg>
