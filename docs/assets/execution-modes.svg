<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" width="960" height="464" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">How cli.start() picks a mode</title>
  <desc id="dsc">A decision flow with two questions and four outcomes. First question: were any arguments given? If they were given but every one is empty, or the whole input is just a double dash, the help index is printed and the CLI stops. If arguments were given otherwise, direct mode runs: parse the arguments, run the single matched command, set process.exitCode and exit. If no arguments were given, the second question applies: are stdin and stdout both a real terminal? If yes, the interactive shell starts — banner, then read a line, run it, repeat until exit, quit or Ctrl-D. If no, because output is piped or input is redirected, the help index is printed and the CLI stops; this is the outcome people hit when they pipe the program into a pager. A side note explains that in direct mode a vertical bar is not a pipe.</desc>

  <style>
    .bg    { fill:#f6f8fa }
    .grp   { fill:#eaeef2 }
    .chip  { fill:#ffffff; stroke:#d0d7de }
    .card  { fill:#ffffff; stroke:#2f6f4f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .warnbox { fill:#ffffff; stroke:#a3401f }
    .seam  { fill:none; stroke:#afb8c1; stroke-dasharray:6 5 }
    .ln    { fill:none; stroke:#2f6f4f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .lnn   { fill:none; stroke:#8c959f; stroke-width:1.4 }
    .lnw   { fill:none; stroke:#a3401f; stroke-width:1.4 }
    .ah    { fill:#2f6f4f }
    .ah2   { fill:#3f6b8a }
    .ahn   { fill:#8c959f }
    .ahw   { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#636c76; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#636c76 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#2f6f4f }
    .monon { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#1f2328 }
    .warnt { fill:#a3401f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#56d364} .alt{fill:#161b22;stroke:#7fb3d5}
      .warnbox{fill:#161b22;stroke:#e08a68}
      .seam{stroke:#484f58}
      .ln{stroke:#56d364} .ln2{stroke:#7fb3d5} .lnn{stroke:#6e7681} .lnw{stroke:#e08a68}
      .ah{fill:#56d364} .ah2{fill:#7fb3d5} .ahn{fill:#6e7681} .ahw{fill:#e08a68}
      .mono{fill:#56d364} .monon{fill:#e6edf3} .warnt{fill:#e08a68}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="n" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ahn" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="w" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ahw" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="464" rx="12"/>

  <rect class="card" x="40" y="44" width="190" height="36" rx="6"/>
  <text class="mono" x="135" y="67" text-anchor="middle">await cli.start()</text>

  <path class="ln2" d="M 135 80 V 92" marker-end="url(#b)"/>

  <rect class="alt" x="40" y="96" width="190" height="88" rx="6"/>
  <text class="lbl" x="52" y="116">QUESTION 1</text>
  <text class="h" x="52" y="136">Any arguments given?</text>
  <text class="monon" x="52" y="154">process.argv.slice(2)</text>
  <text class="s" x="52" y="170">or the array you passed</text>

  <path class="lnn" d="M 230 120 H 262 V 66 H 296" marker-end="url(#n)"/>
  <text class="s" x="294" y="58" text-anchor="end">yes, but…</text>

  <rect class="chip" x="300" y="40" width="380" height="52" rx="6"/>
  <text class="h" x="314" y="62">help index, then stop</text>
  <text class="s" x="314" y="79">nothing to run: every argument is empty, or the input is just <tspan class="monon">--</tspan></text>

  <path class="ln" d="M 230 150 H 296" marker-end="url(#a)"/>
  <text class="s" x="248" y="144">yes</text>

  <rect class="card" x="300" y="104" width="380" height="92" rx="6"/>
  <text class="h" x="314" y="126">Direct mode</text>
  <text class="s" x="314" y="146">1. parse the arguments</text>
  <text class="s" x="314" y="162">2. run the single matched command</text>
  <text class="s" x="314" y="178">3. set <tspan class="monon">process.exitCode</tspan>, then exit</text>

  <path class="ln2" d="M 135 184 V 234" marker-end="url(#b)"/>
  <text class="s" x="144" y="214">no arguments</text>

  <rect class="alt" x="40" y="240" width="190" height="88" rx="6"/>
  <text class="lbl" x="52" y="260">QUESTION 2</text>
  <text class="h" x="52" y="280">Are stdin AND stdout</text>
  <text class="h" x="52" y="296">both a real terminal?</text>
  <text class="s" x="52" y="314">asked only when no args</text>

  <path class="ln" d="M 230 266 H 296" marker-end="url(#a)"/>
  <text class="s" x="248" y="260">yes</text>

  <rect class="card" x="300" y="216" width="380" height="100" rx="6"/>
  <text class="h" x="314" y="238">Interactive shell</text>
  <text class="s" x="314" y="258">1. print the banner</text>
  <text class="s" x="314" y="274">2. read a line → run it → repeat</text>
  <text class="s" x="314" y="290">3. until <tspan class="monon">exit</tspan> / <tspan class="monon">quit</tspan> / Ctrl-D</text>

  <path class="lnw" d="M 230 310 H 262 V 374 H 296" marker-end="url(#w)"/>
  <text class="s" x="236" y="304">no</text>

  <rect class="warnbox" x="300" y="336" width="380" height="84" rx="6"/>
  <text class="h warnt" x="314" y="358">help index, then stop</text>
  <text class="s" x="314" y="376">no arguments, and output is piped or input is redirected</text>
  <text class="s" x="314" y="392"><tspan class="monon">mycli | less</tspan> prints the help index, not a shell prompt</text>
  <text class="s warnt" x="314" y="408">this is the outcome that catches beginners out</text>

  <rect class="chip" x="700" y="104" width="236" height="92" rx="6"/>
  <text class="lbl" x="712" y="124">SIDE NOTE</text>
  <text class="s" x="712" y="142">in direct mode <tspan class="monon">|</tspan> is not a pipe —</text>
  <text class="s" x="712" y="158">your OS shell already handled it,</text>
  <text class="s" x="712" y="174">or it arrives as a literal argument</text>

  <path class="seam" d="M 40 436 H 936"/>
  <text class="s" x="480" y="456" text-anchor="middle">cli.start() never guesses: with arguments it runs exactly one command; with none it opens the shell only when both ends are a real terminal.</text>
</svg>
