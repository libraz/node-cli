<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">ライフサイクルイベントとプラグイン登録</title>
  <desc id="dsc">左の欄は 1 回のコマンド実行で発火する順番を縦に並べたものです。解決とパース、command.validate(ctx)、beforeExecute(ctx)、action(ctx)、afterExecute(ctx) と進みます。横のレールはどの段階でも失敗しうることを示し、同じ失敗点から commandError(err, ctx) と error(err) の両方へ矢印が伸びます。下段の exit は cli.start() が終わるときに 1 回発火しますが、通常のプログラム実行の経路では発火しません。右の欄は 2 つの cli.use が各プラグインに PluginContext を渡し、そこから command()・on()・off()・catch() を呼んで、1 つの共有レジストリとイベントリスナーへ書き込む様子を示します。プラグイン本体は 1 本の直列キューで実行され、例外を投げたプラグインは致命的です。</desc>

  <style>
    .bg    { fill:#f6f8fa }
    .grp   { fill:#eaeef2 }
    .chip  { fill:#ffffff; stroke:#d0d7de }
    .card  { fill:#ffffff; stroke:#2f6f4f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .warnbox { fill:#ffffff; stroke:#a3401f }
    .seam  { fill:none; stroke:#afb8c1; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#afb8c1; stroke-width:1 }
    .ln    { fill:none; stroke:#2f6f4f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .lnw   { fill:none; stroke:#a3401f; stroke-width:1.4 }
    .ah    { fill:#2f6f4f }
    .ah2   { fill:#3f6b8a }
    .ahw   { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#636c76; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#636c76 }
    .n     { font-size:10.5px; fill:#1f2328 }
    .warnt { font-size:10.5px; fill:#a3401f }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#2f6f4f }
    .mono2 { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#3f6b8a }
    .monow { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#a3401f }
    .monod { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#1f2328 }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#56d364} .alt{fill:#161b22;stroke:#7fb3d5}
      .warnbox{fill:#161b22;stroke:#e08a68}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#56d364} .ln2{stroke:#7fb3d5} .lnw{stroke:#e08a68}
      .ah{fill:#56d364} .ah2{fill:#7fb3d5} .ahw{fill:#e08a68}
      .mono{fill:#56d364} .mono2{fill:#7fb3d5} .monow{fill:#e08a68} .warnt{fill:#e08a68}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e} .n{fill:#e6edf3} .monod{fill:#e6edf3}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="w" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ahw" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="480" rx="12"/>
  <text class="h" x="24" y="34">ライフサイクルイベントとプラグイン登録</text>

  <!-- ============ 左: 発火順 ============ -->
  <rect class="grp" x="24" y="48" width="516" height="376" rx="10"/>
  <text class="lbl" x="40" y="68">1 回のコマンド実行で発火する順番</text>

  <rect class="chip" x="48" y="80" width="190" height="34" rx="7"/>
  <text class="n" x="143" y="102" text-anchor="middle">解決とパース</text>
  <path class="ln" d="M 143 114 V 126" marker-end="url(#a)"/>

  <rect class="chip" x="48" y="128" width="190" height="34" rx="7"/>
  <text class="mono" x="143" y="150" text-anchor="middle">command.validate(ctx)</text>
  <path class="ln" d="M 143 162 V 174" marker-end="url(#a)"/>

  <rect class="chip" x="48" y="176" width="190" height="34" rx="7"/>
  <text class="mono" x="143" y="198" text-anchor="middle">beforeExecute(ctx)</text>
  <path class="ln" d="M 143 210 V 222" marker-end="url(#a)"/>

  <rect class="chip" x="48" y="224" width="190" height="34" rx="7"/>
  <text class="mono" x="143" y="246" text-anchor="middle">action(ctx)</text>
  <path class="ln" d="M 143 258 V 270" marker-end="url(#a)"/>

  <rect class="chip" x="48" y="272" width="190" height="34" rx="7"/>
  <text class="mono" x="143" y="294" text-anchor="middle">afterExecute(ctx)</text>

  <!-- 失敗の分岐 -->
  <path class="lnw" d="M 238 97 H 254"/>
  <path class="lnw" d="M 238 145 H 254"/>
  <path class="lnw" d="M 238 193 H 254"/>
  <path class="lnw" d="M 238 241 H 254"/>
  <path class="lnw" d="M 238 289 H 254"/>
  <path class="lnw" d="M 254 97 V 289"/>
  <path class="lnw" d="M 254 193 C 272 193, 278 156, 296 156" marker-end="url(#w)"/>
  <path class="lnw" d="M 254 193 C 272 193, 278 216, 296 216" marker-end="url(#w)"/>

  <text class="warnt" x="300" y="132">失敗するとこの両方が発火します</text>
  <rect class="warnbox" x="300" y="140" width="210" height="32" rx="7"/>
  <text class="monow" x="314" y="160">commandError(err, ctx)</text>
  <rect class="warnbox" x="300" y="200" width="210" height="32" rx="7"/>
  <text class="monow" x="314" y="220">error(err)</text>

  <text class="s" x="300" y="252"><tspan class="monod">commandError</tspan> はコマンドの経路が</text>
  <text class="s" x="300" y="266">解決したあとにだけ発火します。</text>
  <text class="s" x="300" y="280"><tspan class="monod">error</tspan> は未知のコマンドや引用の誤りなど、</text>
  <text class="s" x="300" y="294">それ以前の失敗でも発火します。</text>

  <path class="ln2" d="M 143 306 V 330" marker-end="url(#b)"/>
  <rect class="alt" x="48" y="332" width="190" height="34" rx="7"/>
  <text class="mono2" x="143" y="354" text-anchor="middle">exit</text>
  <text class="s" x="252" y="346"><tspan class="monod">cli.start()</tspan> が終わるときに 1 回発火します。</text>
  <text class="s" x="252" y="360">通常の <tspan class="monod">cli.</tspan><tspan class="monod">exec</tspan><tspan class="monod">()</tspan> の経路では発火しません。</text>

  <text class="s" x="40" y="392">ハンドラーは登録順に await されます。ハンドラーが例外を投げても</text>
  <text class="s" x="40" y="406">コマンドは壊れず、その例外は <tspan class="monod">error</tspan> として再送出されます。</text>

  <!-- ============ 右: プラグイン ============ -->
  <rect class="grp" x="556" y="48" width="380" height="376" rx="10"/>
  <text class="lbl" x="572" y="68">プラグイン</text>

  <rect class="chip" x="572" y="80" width="168" height="30" rx="7"/>
  <text class="monod" x="656" y="100" text-anchor="middle">cli.use(pluginA)</text>
  <rect class="chip" x="752" y="80" width="168" height="30" rx="7"/>
  <text class="monod" x="836" y="100" text-anchor="middle">cli.use(pluginB)</text>

  <path class="ln" d="M 656 110 V 128" marker-end="url(#a)"/>
  <path class="ln" d="M 836 110 V 128" marker-end="url(#a)"/>

  <rect class="card" x="572" y="130" width="348" height="30" rx="7"/>
  <text class="mono" x="746" y="150" text-anchor="middle">PluginContext</text>

  <path class="ln" d="M 746 160 V 170"/>
  <path class="ln" d="M 612 170 H 880"/>
  <path class="ln" d="M 612 170 V 178" marker-end="url(#a)"/>
  <path class="ln" d="M 701 170 V 178" marker-end="url(#a)"/>
  <path class="ln" d="M 790 170 V 178" marker-end="url(#a)"/>
  <path class="ln" d="M 879 170 V 178" marker-end="url(#a)"/>

  <rect class="chip" x="572" y="180" width="80" height="28" rx="6"/>
  <text class="monod" x="612" y="199" text-anchor="middle">command()</text>
  <rect class="chip" x="661" y="180" width="80" height="28" rx="6"/>
  <text class="monod" x="701" y="199" text-anchor="middle">on()</text>
  <rect class="chip" x="750" y="180" width="80" height="28" rx="6"/>
  <text class="monod" x="790" y="199" text-anchor="middle">off()</text>
  <rect class="chip" x="839" y="180" width="81" height="28" rx="6"/>
  <text class="monod" x="879" y="199" text-anchor="middle">catch()</text>

  <path class="ln" d="M 612 208 V 216"/>
  <path class="ln" d="M 701 208 V 216"/>
  <path class="ln" d="M 790 208 V 216"/>
  <path class="ln" d="M 879 208 V 216"/>
  <path class="ln" d="M 612 216 H 879"/>
  <path class="ln" d="M 746 216 V 228" marker-end="url(#a)"/>

  <rect class="alt" x="572" y="230" width="348" height="54" rx="9"/>
  <rect class="chip" x="584" y="242" width="156" height="30" rx="6"/>
  <text class="n" x="662" y="261" text-anchor="middle">コマンドレジストリ</text>
  <rect class="chip" x="752" y="242" width="156" height="30" rx="6"/>
  <text class="n" x="830" y="261" text-anchor="middle">イベントリスナー</text>

  <rect class="chip" x="572" y="300" width="348" height="56" rx="7"/>
  <text class="s" x="586" y="320">プラグイン本体は 1 本の直列キューで実行されるので、</text>
  <text class="s" x="586" y="334"><tspan class="monod">async</tspan> なプラグインがあっても、</text>
  <text class="s" x="586" y="348">登録順は決定的になります。</text>

  <rect class="warnbox" x="572" y="364" width="348" height="44" rx="7"/>
  <text class="warnt" x="586" y="384">プラグインが例外を投げると致命的です。CLI が</text>
  <text class="warnt" x="586" y="398">報告し、どのコマンドも走る前に停止します。</text>

  <path class="seam" d="M 24 442 H 936"/>
  <text class="s" x="480" y="462" text-anchor="middle">ライフサイクルのハンドラーは登録順に await されます。async なリスナーは、そのフックした段階を待たせます。</text>
</svg>
